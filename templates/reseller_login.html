<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX Reseller Login</title>
<style>
body{font-family:sans-serif;background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.login-box{background:#1a1a1a;padding:40px;border-radius:12px;width:380px;border:1px solid #2a2a2a;}
h1{color:#0088ff;text-align:center;margin-bottom:20px}
input{width:100%;padding:12px;margin:10px 0;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:6px;box-sizing:border-box}
input:focus{outline:none;border-color:#0088ff}
button{width:100%;padding:12px;background:#0088ff;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#0066cc}
.error{background:#330000;color:#ff5555;padding:10px;border-radius:6px;margin-bottom:10px;text-align:center;font-size:13px}
.link{text-align:center;margin-top:15px}
.link a{color:#888;text-decoration:none;font-size:12px}
</style>
</head>
<body>
<div class="login-box">
  <h1>💼 RESELLER LOGIN</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="text" name="username" placeholder="Username" required autofocus>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">LOGIN</button>
  </form>
  <div class="link">
    <a href="{{ url_for('login') }}">← Back to Admin Login</a>
  </div>
</div>
</body>
</html>
